server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: advertiser-crm
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/advertiser_crm}
    username: ${DB_USERNAME:crm_user}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

app:
  business-zone: ${BUSINESS_TIME_ZONE:UTC}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  auth-rate-limit:
    login-max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${AUTH_LOGIN_WINDOW_MINUTES:5}
    registration-max-attempts: ${AUTH_REGISTRATION_MAX_ATTEMPTS:3}
    registration-window-minutes: ${AUTH_REGISTRATION_WINDOW_MINUTES:60}
    maximum-entries: ${AUTH_RATE_LIMIT_MAXIMUM_ENTRIES:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    root: INFO
    com.internship.crm: INFO
